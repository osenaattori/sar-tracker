name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover backend/tests -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Security scan (Trivy IaC)
        # Pinned to a commit SHA (v0.36.0) so a moved tag can't change what runs.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          trivyignores: infra/.trivyignore # accepted risks, each with a written reason
          exit-code: "1"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (simulator, no signing)
        run: |
          xcodebuild -project ios/SARTracker/SARTracker.xcodeproj \
            -scheme SARTracker \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
